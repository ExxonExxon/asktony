<nav id="main-nav" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] w-[95%] max-w-7xl transition-transform duration-500 ease-in-out">
    <div class="glass-navbar rounded-full px-8 py-3 flex items-center justify-between shadow-lg">
        <!-- Logo -->
        <a href="/" class="flex items-center space-x-2 group">
            <img src="/images/logo.png" alt="AskTony" class="h-6 w-auto grayscale contrast-125 group-hover:grayscale-0 transition-all duration-700">
            <span class="text-lg font-black tracking-tighter text-[#1c1917] uppercase">AskTony.</span>
        </a>

        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center space-x-10">
            <a href="#how-it-works" class="text-[11px] font-bold text-stone-400 hover:text-[#1c1917] transition-colors uppercase tracking-[0.2em]">Process</a>
            <a href="#services" class="text-[11px] font-bold text-stone-400 hover:text-[#1c1917] transition-colors uppercase tracking-[0.2em]">Services</a>
            <a href="#about" class="text-[11px] font-bold text-stone-400 hover:text-[#1c1917] transition-colors uppercase tracking-[0.2em]">Story</a>
            <div class="h-4 w-[1px] bg-stone-200"></div>
            <a href="https://tradsiee.com" class="btn-primary">

        <!-- Mobile Menu Toggle (Minimal) -->
        <div class="md:hidden">
            <a href="https://tradsiee.com" class="btn-primary px-5 py-2 !text-[10px]">
                Record Video
            </a>
        </div>
    </div>
</nav>

<script>
    let lastScrollTop = 0;
    const nav = document.getElementById('main-nav');
    const scrollThreshold = 50; // Minimum scroll before hiding

    window.addEventListener('scroll', function() {
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        // Don't do anything for very small scrolls
        if (Math.abs(lastScrollTop - scrollTop) <= 5) return;

        if (scrollTop > lastScrollTop && scrollTop > scrollThreshold) {
            // Scrolling down - hide navbar
            nav.style.transform = 'translate(-50%, -150%)';
        } else {
            // Scrolling up - show navbar
            nav.style.transform = 'translate(-50%, 0)';
        }
        
        lastScrollTop = scrollTop;
    }, { passive: true });
</script>
